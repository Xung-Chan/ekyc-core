buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
  }
}

def getExtOrDefault(name, defaultValue) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

android {
  namespace "com.ekyccore"

  compileSdkVersion getExtOrDefault("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 24)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  androidResources {
    noCompress +=  ["bic", "tflite", "onnx", "bin"]
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // 1. Nhúng trực tiếp từng file .aar / .jar
  implementation files("libs/ekyc_sdk-release-v3.6.6.aar")
  implementation files("libs/scanqr_ic_sdk-release-v1.0.6.aar")

  // 2. Thêm các thư viện phụ thuộc của SDK
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.constraintlayout:constraintlayout:2.2.0"
  implementation "org.bouncycastle:bcpkix-jdk15on:1.70"
  implementation("me.dm7.barcodescanner:zxing:1.9.8") {
    exclude group: "com.android.support"
  }
  implementation "com.airbnb.android:lottie:6.4.0"
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.databinding:viewbinding:8.7.2"

  implementation "androidx.camera:camera-core:1.3.1"
  implementation "androidx.camera:camera-camera2:1.3.1"
  implementation "androidx.camera:camera-lifecycle:1.3.1"
  implementation "androidx.camera:camera-view:1.3.1"
}
